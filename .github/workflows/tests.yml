name: Offline regression tests
on:
  push:
    branches: [master]
  pull_request:
permissions:
  contents: read
jobs:
  tests:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    env:
      EVENTLET_NO_GREENDNS: 'yes'
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - run: python -m pip install -r requirements.txt 'pytest>=8,<10'
      - run: python -m pytest -q tests/test_core.py
      - run: python tests/http_smoke.py
